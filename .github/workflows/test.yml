name: test
on: [push, pull_request]
permissions:
  contents: read
env:
  TELE_BOT_TOKEN: test-token
  REGION: test-region
  REGION2: test-region-2
  DB_USER: test-user
  DB_PASSWORD: test-password
  DB_NAME: test-db
  DB_HOST: localhost
  DB_PORT: "5432"
  OPENAI_API_KEY: test-openai-key
  LANGSMITH_API_KEY: test-langsmith-key
  GOOGLE_CLOUD_PROJECT: test-project
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements-test.txt}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -m "not integration and not live" --cov --cov-branch --cov-report= -q
        env: {COVERAGE_FILE: .coverage.fast}
      - uses: actions/upload-artifact@v4
        with: {name: coverage-fast, path: .coverage.fast, include-hidden-files: true}
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: expense_test}
        options: >-
          --health-cmd "pg_isready -U postgres -d expense_test" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements-test.txt}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -m integration --cov --cov-branch --cov-report= -q
        env: {TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/expense_test, DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/expense_test, COVERAGE_FILE: .coverage.integration}
      - uses: actions/upload-artifact@v4
        with: {name: coverage-integration, path: .coverage.integration, include-hidden-files: true}
  coverage:
    needs: [fast, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements-test.txt}
      - run: python -m pip install -r requirements-test.txt
      - uses: actions/download-artifact@v4
        with: {path: coverage-data}
      - run: python -m coverage combine coverage-data/** && python -m coverage report
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t expense-tracker-telegram-bot:test .
